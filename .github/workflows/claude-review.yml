# PR review by Claude, on request only: the repo owner comments "@claude review" (or "@claude cc") on a pull request.
# Anyone else's comment is ignored. Read-only on the code: it comments, it never pushes.
name: Claude review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  review:
    if: >-
      github.event.comment.user.login == github.repository_owner &&
      (github.event.issue.pull_request || github.event.pull_request) &&
      contains(github.event.comment.body, '@claude') &&
      (contains(github.event.comment.body, 'review') || contains(github.event.comment.body, 'cc'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          trigger_phrase: '@claude'
          claude_args: |
            --append-system-prompt "You are reviewing a pull request. Report only real problems: bugs, security issues, broken behaviour, missing error handling that matters. Skip style and formatting: the code is deliberately dense. Project rules: app/server runs TypeScript directly on Node type stripping, so no enum, namespace or parameter properties; .claude/skills/ holds upstream skills we don't review unless the PR changes our own engines (pixel-art, anime-cel, paper-cutout, whiteboard, video-clone, blender-product-film). Put each finding as an inline comment on the line, then one short summary. If nothing is wrong, say so in one line. Write in Traditional Chinese."
